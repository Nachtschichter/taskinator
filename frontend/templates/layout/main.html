<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Taskinator | AdminLTE 4 Dashboard</title>
    <!-- AdminLTE 4 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta2/dist/css/adminlte.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Alpine.js for reactivity -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="layout-fixed sidebar-mini sidebar-collapse-flag-system">
    <div class="app-wrapper">
        <!-- Navbar -->
        <nav class="app-header navbar navbar-expand-lg bg-dark text-white">
            <div class="container-fluid">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-lte-toggle="sidebar">
                            <i class="bi bi-list"></i>
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/logout"><i class="bi bi-box-arrow-right"></i> Logout</a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Sidebar -->
        <aside class="app-sidebar bg-dark text-white" data-sidebar-style="dark">
            <div class="sidebar-brand">
                <a href="/" class="brand-link">
                    <span class="brand-text font-weight-light">Taskinator 🦀</span>
                </a>
            </div>
            <div class="sidebar-wrapper">
                <nav class="sidebar-page">
                    <ul class="nav-sidebar">
                        <li class="nav-item">
                            <a href="/board" class="nav-link active">
                                <i class="nav-icon bi bi-kanban"></i>
                                <p>Kanban Board</p>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="/tasks" class="nav-link">
                                <i class="nav-icon bi bi-list-check"></i>
                                <p>All Tasks</p>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="app-main-container">
            <div class="app-content-wrapper">
                <div class="app-content-header">
                    <div class="container-fluid">
                        <h1>{% block title %}Dashboard{% endblock %}</h1>
                    </div>
                </div>
                <div class="app-content">
                    <div class="container-fluid">
                        {% block content %}{% endblock %}
                    </div>
                </div>
            </div>
            <footer class="app-footer">
                <div class="float-right"><b>Version</b> 4.0-beta (Rebuild)</div>
                <strong>Copyright &copy; 2026 <a href="#">Taskinator</a>.</strong> All rights reserved.
            </footer>
        </main>
    </div>
    <!-- AdminLTE 4 JS -->
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta2/dist/js/adminlte.min.js"></script>
</body>
</html>
