{% extends "layout/main.html" %}

{% block title %}Projects{% endblock %}
{% block page_title %}Project Settings{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Create Project</h3>
                </div>
                <div class="card-body">
                    <form action="/admin/projects/create" method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                        <div class="mb-3">
                            <label class="form-label">Project Name</label>
                            <input type="text" class="form-control" name="name" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Create</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Existing Projects</h3>
                </div>
                <div class="card-body">
                    <ul class="list-group">
                        {% for p in projects %}
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            {{ p.name }}
                            <form action="/admin/projects/{{ p.id }}/delete" method="POST" class="d-inline">
                                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                                <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Delete project?')">Delete</button>
                            </form>
                        </li>
                        {% endfor %}
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
