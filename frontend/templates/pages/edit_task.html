{% extends "layout/main.html" %}

{% block title %}Edit Task{% endblock %}
{% block page_title %}Edit Task #{{ task.id }}{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Edit Task</h3>
                </div>
                <div class="card-body">
                    <form action="/tasks/update-details" method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                        <input type="hidden" name="task_id" value="{{ task.id }}">
                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" class="form-control" name="title" value="{{ task.title }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" name="description" rows="4">{{ task.description or '' }}</textarea>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">Priority</label>
                                <select class="form-select" name="priority">
                                    <option value="LOW" {% if task.priority.value == 'LOW' %}selected{% endif %}>Low</option>
                                    <option value="MEDIUM" {% if task.priority.value == 'MEDIUM' %}selected{% endif %}>Medium</option>
                                    <option value="HIGH" {% if task.priority.value == 'HIGH' %}selected{% endif %}>High</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Category</label>
                                <select class="form-select" name="category">
                                    <option value="feature" {% if task.category.value == 'feature' %}selected{% endif %}>Feature</option>
                                    <option value="fix" {% if task.category.value == 'fix' %}selected{% endif %}>Fix</option>
                                    <option value="hotfix" {% if task.category.value == 'hotfix' %}selected{% endif %}>Hotfix</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Project</label>
                                <input type="text" class="form-control" name="project" value="{{ task.project or '' }}">
                            </div>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a href="/board" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
