name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  review-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check for Auto-Review in PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "🔍 Checking for Auto-Review documentation..."
          if echo "$PR_BODY" | grep -qiE "auto-review|review-service"; then
            echo "✅ Auto-Review documentation found"
          else
            echo "⚠️  WARNING: No Auto-Review documentation found!"
            echo "⚠️  This check is a reminder only. PR can still be merged."
          fi

  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile main.py
      - name: Check templates exist
        run: |
          test -f templates/board.html || (echo "❌ board.html missing" && exit 1)
          test -f templates/login.html || (echo "❌ login.html missing" && exit 1)
          echo "✅ Templates verified"

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [lint-build]
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t taskinator-taskinator:latest .
      
      - name: Create data directory and start Taskinator
        run: |
          # Create local data directory
          mkdir -p /tmp/taskinator-data
          chmod 777 /tmp/taskinator-data
          
          # Remove old container if exists
          docker rm -f taskinator-ci || true
          
          # Start container with volume mount
          docker run -d --name taskinator-ci \
            -p 9900:9900 \
            -v /tmp/taskinator-data:/app/data \
            -e SECRET_KEY="ci-test-secret-key-12345" \
            -e ADMIN_PASSWORD="Taskinator2026!" \
            -e DATABASE_URL="sqlite:///app/data/taskinator.db" \
            taskinator-taskinator:latest
          
          # Wait for container with longer timeout
          for i in {1..60}; do
            if curl -sf ${TEST_BASE_URL:-http://localhost:9900}/login > /dev/null 2>&1; then
              echo "✅ Taskinator is ready"
              exit 0
            fi
            echo "Waiting for Taskinator... ($i/60)"
            sleep 3
          done
          
          echo "❌ Taskinator failed to start"
          docker logs taskinator-ci
          exit 1
      
      - name: Verify container health
        run: |
          echo "Checking container..."
          docker ps | grep taskinator-ci
          curl -I ${TEST_BASE_URL:-http://localhost:9900}/login
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        working-directory: ./e2e-tests
        run: |
          npm install
          npx playwright install --with-deps chromium
      
      - name: Run E2E Tests
        working-directory: ./e2e-tests
        env:
          TEST_BASE_URL: ${TEST_BASE_URL:-http://localhost:9900}
          ADMIN_PASSWORD: "Taskinator2026!"
        run: |
          echo "Running E2E tests..."
          npx playwright test --reporter=list 2>&1 || true
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e-tests/results/
          retention-days: 7
      
      - name: Cleanup container
        if: always()
        run: |
          docker stop taskinator-ci || true
          docker rm taskinator-ci || true