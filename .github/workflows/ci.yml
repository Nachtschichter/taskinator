name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Lint & Build
  # ───────────────────────────────────────────────────────────────────────────
  lint-build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Syntax check
        run: python -m py_compile main.py

  # ───────────────────────────────────────────────────────────────────────────
  # E2E Tests (Playwright)
  # ───────────────────────────────────────────────────────────────────────────
  e2e-tests:
    runs-on: ubuntu-latest
    needs: [lint-build]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t taskinator-taskinator:latest .
      
      - name: Start Taskinator container
        run: |
          docker run -d --name taskinator -p 9900:9900 taskinator-taskinator:latest
          # Wait for container to be healthy
          for i in {1..30}; do
            if curl -f http://localhost:9900/login >/dev/null 2>&1; then
              echo "✅ Taskinator is ready"
              exit 0
            fi
            echo "Waiting for Taskinator... ($i/30)"
            sleep 2
          done
          echo "❌ Taskinator failed to start"
          docker logs taskinator
          exit 1
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e-tests/package-lock.json
      
      - name: Install dependencies
        working-directory: ./e2e-tests
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium
      
      - name: Run E2E Tests
        working-directory: ./e2e-tests
        env:
          TEST_BASE_URL: http://localhost:9900
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: npx playwright test --reporter=list
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e-tests/results/
          retention-days: 7
      
      - name: Cleanup container
        if: always()
        run: |
          docker stop taskinator || true
          docker rm taskinator || true
