name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Lint & Build
  # ───────────────────────────────────────────────────────────────────────────
  lint-build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Syntax check
        run: python -m py_compile main.py

  # ───────────────────────────────────────────────────────────────────────────
  # E2E Tests (Playwright)
  # ───────────────────────────────────────────────────────────────────────────
  e2e-tests:
    runs-on: ubuntu-latest
    needs: [lint-build]
    
    services:
      taskinator:
        image: taskinator-taskinator:latest
        ports:
          - 9900:9900
        options: >-
          --health-cmd "curl -f http://localhost:9900/login || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e-tests/package-lock.json
      
      - name: Install dependencies
        working-directory: ./e2e-tests
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium
      
      - name: Run E2E Tests
        working-directory: ./e2e-tests
        env:
          TEST_BASE_URL: http://localhost:9900
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: npx playwright test --reporter=list
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e-tests/results/
          retention-days: 7
