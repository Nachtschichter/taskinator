version: '3.8'

services:
  taskinator:
    build: .
    container_name: taskinator
    ports:
      - "9900:9900"
    volumes:
      - taskinator-db:/app/data
    environment:
      # IMPORTANT: Set these in a .env file or export them before docker compose up.
      # The application will REFUSE to start with the default SECRET_KEY.
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DATABASE_URL=sqlite:////app/data/taskinator.db
      # Set COOKIE_SECURE=true in production (requires HTTPS)
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9900/login')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  taskinator-db:
