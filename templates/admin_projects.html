<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskinator - Projekte verwalten</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* Admin-specific styles */
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
        }
        .project-list {
            list-style: none;
        }
        .project-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .project-item:last-child {
            border-bottom: none;
        }
        .project-actions {
            display: flex;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🦀 Taskinator - Projekte verwalten</h1>
        <nav>
            <a href="/board">Board</a>
            <a href="/changelog">Changelog</a>
            <a href="/admin/projects">Projects</a>
            <a href="/logout">Logout</a>
        </nav>
    </div>

    <div class="container">
        <div class="card">
            <h2>Neues Projekt erstellen</h2>
            <form action="/admin/projects/create" method="POST">
                <div class="form-group">
                    <label for="name">Projektname</label>
                    <input type="text" id="name" name="name" required placeholder="z.B. Taskinator">
                </div>
                <button type="submit" class="btn btn-primary">Erstellen</button>
            </form>
        </div>

        <div class="card">
            <h2>Bestehende Projekte</h2>
            {% if projects %}
            <ul class="project-list">
                {% for project in projects %}
                <li class="project-item">
                    <span>{{ project.name }}</span>
                    <div class="project-actions">
                        <form action="/admin/projects/{{ project.id }}/delete" method="POST" style="display:inline;">
                            <button type="submit" class="btn btn-danger" onclick="return confirm('Wirklich löschen?')">Löschen</button>
                        </form>
                    </div>
                </li>
                {% endfor %}
            </ul>
            {% else %}
            <p class="text-muted">Keine Projekte vorhanden</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
