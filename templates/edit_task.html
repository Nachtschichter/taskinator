<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskinator - Edit Task</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .container { max-width: 600px; margin: 40px auto; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; }
        input, textarea, select { 
            width: 100%; 
            padding: 12px; 
            border: 2px solid var(--border-color); 
            border-radius: 8px; 
            font-size: 16px; 
        }
        textarea { min-height: 120px; resize: vertical; }
        .actions { 
            display: flex; 
            gap: 12px; 
            margin-top: 30px; 
        }
        .btn { 
            padding: 14px 28px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 16px; 
            text-decoration: none; 
            display: inline-block; 
        }
        .btn-primary { 
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); 
            color: white; 
        }
        .btn-secondary { 
            background: #6c757d; 
            color: white; 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🦀 Taskinator</h1>
            <p>Edit Task #{{ task.id }}</p>
        </div>
        
        <form action="/tasks/update-details" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="hidden" name="task_id" value="{{ task.id }}">
            
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" required maxlength="256" value="{{ task.title }}">
            </div>
            
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" maxlength="1024">{{ task.description or '' }}</textarea>
            </div>
            
            <div class="form-group">
                <label for="priority">Priority</label>
                <select id="priority" name="priority">
                    <option value="LOW" {% if task.priority == 'LOW' %}selected{% endif %}>Low</option>
                    <option value="MEDIUM" {% if task.priority == 'MEDIUM' %}selected{% endif %}>Medium</option>
                    <option value="HIGH" {% if task.priority == 'HIGH' %}selected{% endif %}>High</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category">
                    <option value="feature" {% if task.category == 'feature' %}selected{% endif %}>Feature</option>
                    <option value="fix" {% if task.category == 'fix' %}selected{% endif %}>Fix</option>
                    <option value="hotfix" {% if task.category == 'hotfix' %}selected{% endif %}>Hotfix</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="project">Project</label>
                <select id="project" name="project">
                    <option value="Taskinator" {% if task.project == 'Taskinator' %}selected{% endif %}>Taskinator</option>
                    <option value="tradershome" {% if task.project == 'tradershome' %}selected{% endif %}>tradershome</option>
                    <option value="OpenTradingClaw" {% if task.project == 'OpenTradingClaw' %}selected{% endif %}>OpenTradingClaw</option>
                </select>
            </div>
            
            <div class="actions">
                <a href="/board" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Update Task</button>
            </div>
        </form>
    </div>
</body>
</html>
